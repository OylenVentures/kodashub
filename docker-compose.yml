---
services:
  postgres:
    image: postgres:17
    container_name: postgres_local
    environment:
      - POSTGRES_USER=kodashub_user
      - POSTGRES_PASSWORD=securePassword123
      - POSTGRES_DB=kodashub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: on-failure

  redis_cache:
    image: redis:7-alpine
    container_name: redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data
    restart: on-failure

volumes:
  postgres-data:
  redis_data:

networks:
  default:
    driver: bridge
