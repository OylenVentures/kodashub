services:
  mysql:
    image: mysql:8
    container_name: nest_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nest_api
      MYSQL_USER: nest
      MYSQL_PASSWORD: nest
    ports:
      - '3306:3306'
    volumes:
      - nest_mysql:/var/lib/mysql
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u nest -pnest']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: nest_redis
    ports:
      - '6379:6379'
    volumes:
      - nest_redis:/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  nest_mysql:
    driver: local
  nest_redis:
    driver: local

networks:
  default:
    name: nest_network
    driver: bridge
